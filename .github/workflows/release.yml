name: Build Windows installer          ### DONT FORGET TO CHANGE THE NAME AT THE BOTTOM
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS deps (Tauri CLI)
        run: npm install
      - name: Build installer (auto-downloads WebView2 on first run)
        run: npm run build:win
      - name: Stash bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -Recurse -Force src-tauri/target/release/bundle/* artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-maker-windows-installer                     ########## CHANGE THE NAME LEAVE -windows-installer
          path: artifacts/**
      - name: Create GitHub Release with installer attached
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
